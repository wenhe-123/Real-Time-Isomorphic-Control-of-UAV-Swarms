# Production defaults for online Orbbec control.
# Loaded by functions/runtime/online_defaults.py

Display:
  left_pose_frame_viz_every: 10  # Palm axis overlay cadence (debug)
  webcam_rot_stride: 6  # Dual-rotation USB webcam read stride
  trail_draw_every_frames: 0  # Trail polyline draw cadence (0 = off)
  led_apply_every_frames: 3  # LED material refresh stride
  sim_render_every: 2  # Crazyflow render window stride (0 = off)
  online_imshow_every: 4  # OpenCV Orbbec window refresh stride
  trail_buffer_maxlen: 6  # MuJoCo trail history length
  wcam_preview_window: "Online Control Webcam (dual rotation)"

Camera:
  orbbec_fps: "30"  # Nominal outer-loop / Orbbec rate (Hz)
  mp_input_scale: 0.5  # HandLandmarker input downscale
  mp_detect_every: 2  # Run HandLandmarker every N frames; reuse last on skip
  orbbec_flip_horizontal: false  # Mirror BGR before MediaPipe
  orbbec_use_transformed_depth: false  # K4A color-aligned depth (Femto Bolt: often crashes)
  orbbec_hand_swap: off  # Swap MP left/right for mode vs open (auto | on | off)

Morph:
  target_alpha: 0.44  # Live target low-pass toward morph goals
  morph_world_scale: 0.65  # Gesture mm → sim m workspace scale
  mode_rot_freeze_latch: 18  # Morph mode debounce frames (see pipeline defaults)
  mode_vis_min: 0.55  # Min left-hand MP visibility to change morph mode M1..M5
  open_vis_min: 0.55  # Min right-hand MP visibility for open gesture

Sim:
  drone_model: cf21B_500  # Crazyflow drone model name
  max_sim_substeps_per_frame: 160  # Physics substeps cap per camera frame
  ground_z: 0.0  # Physical ground plane in sim frame (m)

Prearm:
  prearm_hover_z: 1.00  # Formation hover altitude before SPACE (m)
  prearm_takeoff_z: 0.20  # Vertical prearm climb / descent leg height (m)

LeftHandPose:
  # Feature toggles (press 0 = arm rigid follow)
  left_swarm_pose: true
  left_rot_direct_follow: true
  left_swarm_depth_frame_motion: true
  left_pose_debug: true
  left_pose_debug_every: 15
  left_pose_frame_viz: false
  left_unwind_s: 2.6  # Seconds to ease back to morph frame on second press 0

  # Cam → sim embedding (fwd_y: depth Z → sim Y in/out)
  left_cam_preset: fwd_y  # camera | legacy | fwd_y | flip_depth
  left_world_frame: camera_at_arm  # camera_at_arm | sim
  left_cam_y_to_world_z: 1.0  # Image dy → world altitude scale [0, 1]
  left_palm_basis: middle_thumb  # Palm rotation frame MCP pair

  # Translation / rotation gains
  left_axis_sign: [-1.0, 1.0, 1.0]  # Per-axis sign on palm components → world
  left_trans_scale_mm: 0.0075  # Palm mm delta → world meters
  left_max_offset_m: 1.35
  left_lost_decay: 1.0  # Hold last pose when hand lost (1.0 = no decay)
  left_rot_scale: 1.0
  left_rot_gain: 1.35
  left_rot_gate_rad: 0.008  # Min |rotvec| before applying formation rotation
  left_max_rot_rad: 3.14  # Max press-0 relative rotation (rad, ~180°)
  left_rot_trans_tau_mm: 0.0  # Rotation suppression during pans (0 = off)
  left_rot_world_z_scale: 1.0  # Damp world-Z component of axis-angle
  left_plane_rot_scale_mul: 1.0  # Extra rot scale when open snap is plane

  # Depth / palm center filtering
  left_palm_depth_outlier_z_mm: 105.0
  left_palm_depth_outlier_lat_ratio: 2.6
  left_palm_center_depth_ema: 0.75

  # Axis-locked translate vs rotate blend
  axis_trans_deadzone_m: 0.004
  axis_rot_deadzone_rad: 0.008
  axis_trans_on_m: 0.004
  axis_rot_on_rad: 0.012
  axis_trans_rot_coupling: 0.50

  # Dual USB webcam: always polled when enabled; hybrid depth roll/pitch + webcam yaw
  left_dual_webcam_rot: true
  left_rot_webcam_vis_thresh: 0.42  # Legacy HUD / mode-assist only (rotation not gated)
  left_rot_webcam_index: -1  # OpenCV device index (-1 = auto)
