# Example Crazyflie swarm config for ``online_control_real_dual.py``.
# Copy to ``config/drones.toml`` and edit URIs / home positions.

[swarm]
lighthouse = true
ctrl_freq = 100.0
arm_goto_s = 5.0
land_on_exit = true
max_pos_error_m = 0.35

[frame]
# Gesture/sim coordinates (same frame as Crazyflow) → Lighthouse room frame (meters).
#   real_xyz = origin + scale * Rz(yaw_deg) * sim_xyz
# Sim (0,0,0) maps to ``origin`` in the room. Measure homes in cfclient / Lighthouse viewer.
origin = [0.0, 0.0, 1.0]
scale = 1.0
yaw_deg = 0.0

# Physical drones: count here is independent of --point-count (morph virtual points, min 8).
# Drone id "0" receives morph point 0, id "1" → point 1, etc.

[[drone]]
id = "0"
uri = "radio://0/80/2M/E7E7E7E7E7"
home = [0.0, 0.0, 0.05]

[[drone]]
id = "1"
uri = "radio://0/80/2M/E7E7E7E7E8"
home = [0.3, 0.0, 0.05]

# Add more [[drone]] blocks until count matches --point-count.
