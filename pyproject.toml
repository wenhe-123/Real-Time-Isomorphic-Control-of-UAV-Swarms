[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iso-swarm"
version = "0.1.0"
description = "Real-time hand-gesture control for UAV swarms (Orbbec + Crazyflow + axswarm)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"

[project.optional-dependencies]
# Real Crazyflie deploy (Lighthouse or mocap). Install: pip install -e ".[deploy]"
deploy = [
    "cflib2 @ git+https://github.com/bitcraze/crazyflie-lib-python-v2.git",
    "drone-estimators",
]

[tool.pytest.ini_options]
markers = ["unit", "integration", "render"]
addopts = "-m 'not render'"

[tool.ruff]
exclude = [
    ".git",
    ".git-rewrite",
    ".ipynb_checkpoints",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "site-packages",
    "venv",
    "docs/conf.py",
    "submodules/crazyflow",
    "submodules/axswarm",
]

line-length = 100
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "TCH", "ANN"]
ignore = ["ANN401"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"src/backup/tests/*" = ["D100", "D103", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true
suppress-none-returning = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.activation]
env = { PYTHONPATH = "src" }
scripts = ["scripts/activate_orbbec.sh"]

[tool.pixi.dependencies]
pip = "*"
ruff = "*"
matplotlib = ">=3.10.8,<4"

[tool.pixi.pypi-dependencies]
crazyflow = { path = "./submodules/crazyflow", editable = true }
drone-models = { path = "./submodules/drone-models", editable = true }
drone-controllers = { path = "./submodules/drone-controllers", editable = true }
axswarm = { path = "./submodules/axswarm", editable = true }
mediapipe = "*"
opencv-python = "*"

[tool.pixi.feature.gpu]
platforms = ["linux-64"]

[tool.pixi.feature.deploy]
platforms = ["linux-64"]

[tool.pixi.feature.deploy.dependencies]
packaging = "<26"  # required by cflib2 (see swarmgpt)

[tool.pixi.feature.deploy.pypi-dependencies]
cflib2 = { git = "https://github.com/bitcraze/crazyflie-lib-python-v2.git" }
drone-estimators = "*"

[tool.pixi.feature.build]
# empty feature; release env groups build tools below

[tool.pixi.feature.build.pypi-dependencies]
build = ">=1.3"
twine = ">=6.0"

[tool.pixi.tasks]
setup-orbbec = { cmd = "bash scripts/setup_orbbec.sh", description = "Download Orbbec K4A Wrapper + install pyk4a" }
install-pyk4a = { cmd = "bash scripts/install_pyk4a.sh", description = "Install pyk4a when ORBBEC_ROOT is already set" }
setup = { cmd = "bash scripts/setup_orbbec.sh && bash scripts/install_pyk4a.sh", description = "One-time: Orbbec SDK + pyk4a" }
real-dual = { cmd = "python src/online_control_real_dual.py", description = "Orbbec gesture → real Crazyflies" }

[tool.pixi.environments]
default = { features = ["deploy"], solve-group = "default" }
deploy = { features = ["deploy"], solve-group = "default" }
tests = { features = ["tests"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
release = { features = ["build"], solve-group = "default" }
gpu = { features = ["gpu"], solve-group = "gpu" }
gpu-tests = { features = ["tests", "gpu"], solve-group = "gpu" }

[tool.pixi.feature.tests.dependencies]
pytest = ">=8.4.1"
pytest-timeout = ">=2.1.0"
array-api-strict = ">=2.4.1"
matplotlib = "*"

[tool.pixi.feature.tests.tasks]
tests = { cmd = "pytest -v src/backup/tests", description = "Run tests" }

[tool.pixi.feature.docs.dependencies]
python = ">=3.10"
mkdocs = ">=1.5.0"
mkdocs-material = ">=9.0.0"

[tool.pixi.feature.docs.pypi-dependencies]
mkdocs-autorefs = ">=1.2.0"
mkdocstrings = { extras = ["python"], version = ">=0.26.0" }
mkdocs-gen-files = ">=0.5.0"
mkdocs-literate-nav = ">=0.6.0"
mkdocs-section-index = ">=0.3.0"

[tool.pixi.feature.docs.tasks]
docs-build = { cmd = "mkdocs build", description = "Build docs" }
docs-serve = { cmd = "mkdocs serve --livereload", description = "Serve docs locally" }
