[build-system]
requires = ["setuptools>=61.0.0", "wheel", "numpy>=2.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iso-swarm"
version = "0.1.0"
description = "Real-time hand-gesture control for UAV swarms (Orbbec + Crazyflow + axswarm)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
]


########################
# Pip Dependencies
########################

dependencies = [
    "numpy>=2.0.0,<2.5.0",
    "scipy>=1.17.0,<1.18.0",
    "matplotlib>=3.10.8,<4",
    "opencv-python",
    "mediapipe",
    "pyyaml",
]

# option[sim]: basic simulation
[project.optional-dependencies]
sim = [
    "axswarm @ git+https://github.com/learnsyslab/axswarm.git@amswarm",
    "crazyflow==0.1.0",
    "drone-models==0.1.0",
    "drone-controllers==0.1.0",
    "jax >= 0.7",
]
# option[orbbec]: Orbbec camera (Linux wheel; native SDK via pixi run setup-orbbec)
orbbec = [
    "pyk4a>=1.5.0; sys_platform == 'linux'",
]
# option[deploy]: deploy to real drones (mocap via ROS2)
deploy = [
    "cflib2 @ git+https://github.com/bitcraze/crazyflie-lib-python-v2.git",
    "drone-estimators",
    "swarmgpt @ git+https://github.com/utiasDSL/swarmGPT.git",
]

[tool.setuptools.packages]
find = {}

[tool.pytest.ini_options]
markers = ["unit", "integration", "render"]
addopts = "-m 'not render'"


########################
# Pixi Sessions
########################

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.activation]
env = { PYTHONPATH = "src:." }
scripts = ["scripts/activate_orbbec.sh"]

# environments
[tool.pixi.environments]
default = { features = ["sim"], solve-group = "default" }
deploy = { features = ["sim", "kilted", "deploy"], solve-group = "default" }

[tool.pixi.dependencies]
# Environment packages
openblas = ">=0.3.30,<0.4"
ruff = "*"
python = ">=3.12.0,<3.13"
pip = ">=25.0.1,<26"
rust = ">=1.95.0,<1.96"
packaging = "<26"  # Necessary for cflib2
maturin = ">=1.13.3,<2"

[tool.pixi.pypi-dependencies]
iso-swarm = { path = ".", editable = true }

[tool.pixi.tasks]
setup = { cmd = "bash scripts/setup_orbbec.sh && bash scripts/install_pyk4a.sh", description = "One-time: Orbbec SDK + pyk4a (current env)" }
online-dual = { cmd = "bash scripts/run_python.sh src/online_control_dual.py", description = "Orbbec gesture → MuJoCo sim" }
mocap = { cmd = "ros2 launch motion_capture_tracking launch.py", description = "Start mocap → Crazyflie TF (deploy env)" }
real-dual = { cmd = "bash scripts/run_python.sh src/online_control_real_dual.py", description = "Orbbec gesture → real Crazyflies (use -e deploy)" }

[tool.pixi.feature.sim]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.feature.deploy]
platforms = ["linux-64"]

[tool.pixi.feature.deploy.dependencies]
sqlite = "*"

[tool.pixi.feature.deploy.activation]
scripts = ["scripts/ensure_sqlite.sh"]

# feature[kilted]
[tool.pixi.feature.kilted]
platforms = ["linux-64"]
channels = ["https://prefix.dev/robostack-kilted"]

[tool.pixi.feature.kilted.dependencies]
# Build tools
compilers = ">=1.9.0, <1.11.0"
cmake = "==3.26.0"  # Pinned for motion_capture_tracking
pkg-config = "*"
make = "==4.4.1"
ninja = "*"
# ROS specific tools
rosdep = "*"
colcon-common-extensions = "*"
# Kilted specific tools
ros-kilted-desktop = "*"
ros2-distro-mutex = "0.12.*"

[tool.pixi.feature.kilted.activation]
scripts = ["scripts/setup_mocap.sh"]

